{% extends 'base.html' %}

{% block content %}
<main class="dashboard-container">
    <div class="auth-card">
        <h2>HRMS Staff Login</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="auth-error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'staff_login' %}">
            {% csrf_token %}
            <div class="form-field-group">
                <label class="form-field-label" for="username">Username</label>
                <input class="form-field-input" type="text" id="username" name="username" required placeholder="Enter username">
            </div>

            <div class="form-field-group">
                <label class="form-field-label" for="password">Password</label>
                <input class="form-field-input" type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn-send-message" style="margin-top: 1rem;">
                Login
            </button>
        </form>
    </div>
</main>
{% endblock %}
